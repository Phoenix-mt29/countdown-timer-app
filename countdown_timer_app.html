<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Countdown Timer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Modern App Shell Mobile Styling */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Progress Circle Styling */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Custom Input Chrome Removal */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 font-sans antialiased overflow-x-hidden">

    <!-- App Header -->
    <header class="w-full max-w-md flex justify-between items-center pt-2 pb-4 px-2">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                <i class="fa-solid font-bold fa-stopwatch text-base"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-slate-100">Chrono<span class="text-emerald-400">Timer</span></h1>
        </div>
        <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-emerald-400 hover:border-slate-700 transition active:scale-95">
            <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
        </button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center gap-6 my-auto">
        
        <!-- Timer Progress Ring Display -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
            <svg class="w-full h-full" viewBox="0 0 200 200">
                <!-- Outer Background Track -->
                <circle
                    class="text-slate-900"
                    stroke-width="10"
                    stroke="currentColor"
                    fill="transparent"
                    r="86"
                    cx="100"
                    cy="100"
                />
                <!-- Outer Glow Filter Track -->
                <circle
                    id="progressCircleGlow"
                    class="text-emerald-500 opacity-20 transition-all duration-300"
                    stroke-width="12"
                    stroke-dasharray="540.35"
                    stroke-dashoffset="0"
                    stroke-linecap="round"
                    stroke="currentColor"
                    fill="transparent"
                    r="86"
                    cx="100"
                    cy="100"
                />
                <!-- Animated Progress Ring -->
                <circle
                    id="progressCircle"
                    class="progress-ring__circle text-emerald-500 transition-all duration-300"
                    stroke-width="10"
                    stroke-dasharray="540.35"
                    stroke-dashoffset="0"
                    stroke-linecap="round"
                    stroke="currentColor"
                    fill="transparent"
                    r="86"
                    cx="100"
                    cy="100"
                />
            </svg>

            <!-- Time Display Overlay -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span id="timeDisplay" class="font-mono text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-50 drop-shadow-sm">
                    25:00
                </span>
                <span id="statusLabel" class="text-xs uppercase font-semibold tracking-wider text-slate-400 mt-2">
                    Ready
                </span>
            </div>
        </div>

        <!-- Primary Action Controls -->
        <div class="flex items-center gap-4 w-full px-4 justify-center">
            <button id="startPauseBtn" onclick="toggleTimer()" class="flex-1 max-w-[160px] py-3.5 px-6 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
                <i id="startPauseIcon" class="fa-solid fa-play"></i>
                <span id="startPauseText">Start</span>
            </button>

            <button id="resetBtn" onclick="resetTimer()" class="py-3.5 px-5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-semibold text-base flex items-center justify-center gap-2 active:scale-95 transition-all">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset</span>
            </button>
        </div>

        <!-- Quick Presets Grid -->
        <div class="w-full px-2 mt-2">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 px-1 text-center">
                Quick Presets
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                <button onclick="setPreset(300)" class="preset-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 text-slate-200 text-sm font-medium hover:text-emerald-400 transition active:scale-95">5m</button>
                <button onclick="setPreset(600)" class="preset-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 text-slate-200 text-sm font-medium hover:text-emerald-400 transition active:scale-95">10m</button>
                <button onclick="setPreset(900)" class="preset-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 text-slate-200 text-sm font-medium hover:text-emerald-400 transition active:scale-95">15m</button>
                <button onclick="setPreset(1500)" class="preset-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 text-slate-200 text-sm font-medium hover:text-emerald-400 transition active:scale-95">25m</button>
                <button onclick="setPreset(1800)" class="preset-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 text-slate-200 text-sm font-medium hover:text-emerald-400 transition active:scale-95">30m</button>
                <button onclick="setPreset(3600)" class="preset-btn py-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 text-slate-200 text-sm font-medium hover:text-emerald-400 transition active:scale-95">60m</button>
            </div>
        </div>

        <!-- Custom Duration Accordion Input -->
        <div class="w-full px-2">
            <details class="bg-slate-900/80 border border-slate-800/80 rounded-2xl overflow-hidden group">
                <summary class="py-3 px-4 flex items-center justify-between cursor-pointer text-sm font-medium text-slate-400 hover:text-slate-200 select-none">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-sliders text-emerald-400"></i> Set Custom Time</span>
                    <i class="fa-solid fa-chevron-down group-open:rotate-180 transition-transform text-xs"></i>
                </summary>
                <div class="p-4 pt-2 border-t border-slate-800/50 flex flex-col gap-3">
                    <div class="grid grid-cols-3 gap-3">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] uppercase font-bold tracking-wider text-slate-400 text-center">Hours</label>
                            <input type="number" id="customHours" min="0" max="99" value="0" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-1 text-center font-mono text-lg text-emerald-400 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] uppercase font-bold tracking-wider text-slate-400 text-center">Minutes</label>
                            <input type="number" id="customMinutes" min="0" max="59" value="25" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-1 text-center font-mono text-lg text-emerald-400 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] uppercase font-bold tracking-wider text-slate-400 text-center">Seconds</label>
                            <input type="number" id="customSeconds" min="0" max="59" value="0" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-1 text-center font-mono text-lg text-emerald-400 focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                    <button onclick="applyCustomTime()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-xs uppercase tracking-wider transition active:scale-95">
                        Apply Custom Duration
                    </button>
                </div>
            </details>
        </div>

    </main>

    <!-- Footer Information -->
    <footer class="w-full max-w-md text-center py-2 text-xs text-slate-400">
        APK Ready • Touch-Optimized UI
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // State variables
        let totalTime = 1500; // default 25 mins in seconds
        let remainingTime = 1500;
        let timerInterval = null;
        let isRunning = false;
        let soundEnabled = true;

        // Circle SVG circumference calculation: 2 * PI * r (r=86)
        const CIRCUMFERENCE = 2 * Math.PI * 86;

        // DOM Element references
        const timeDisplay = document.getElementById('timeDisplay');
        const statusLabel = document.getElementById('statusLabel');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseIcon = document.getElementById('startPauseIcon');
        const startPauseText = document.getElementById('startPauseText');
        const progressCircle = document.getElementById('progressCircle');
        const soundIcon = document.getElementById('soundIcon');

        // Initialize progress ring settings
        progressCircle.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;

        // Format seconds into HH:MM:SS or MM:SS format
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            const pad = (num) => String(num).padStart(2, '0');

            if (h > 0) {
                return `${pad(h)}:${pad(m)}:${pad(s)}`;
            }
            return `${pad(m)}:${pad(s)}`;
        }

        // Update display text and progress ring offset
        function updateDisplay() {
            timeDisplay.textContent = formatTime(remainingTime);

            // Calculate progress percentage
            const progress = remainingTime / totalTime;
            const offset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
            progressCircle.style.strokeDashoffset = isNaN(offset) ? 0 : offset;
        }

        // Timer Start/Pause Toggle
        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingTime <= 0) return;

            // Ensure AudioContext is unlocked by user interaction
            initAudio();

            isRunning = true;
            statusLabel.textContent = "Running";
            statusLabel.classList.remove('text-slate-500', 'text-emerald-400');
            statusLabel.classList.add('text-emerald-400');

            startPauseBtn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
            startPauseBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
            startPauseIcon.className = "fa-solid fa-pause";
            startPauseText.textContent = "Pause";

            timerInterval = setInterval(() => {
                remainingTime--;
                updateDisplay();

                if (remainingTime <= 0) {
                    onTimerComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            statusLabel.textContent = "Paused";
            statusLabel.classList.remove('text-emerald-400');
            statusLabel.classList.add('text-amber-400');

            startPauseBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
            startPauseBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
            startPauseIcon.className = "fa-solid fa-play";
            startPauseText.textContent = "Resume";
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingTime = totalTime;

            statusLabel.textContent = "Ready";
            statusLabel.className = "text-xs uppercase font-semibold tracking-wider text-slate-500 mt-2";

            startPauseBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
            startPauseBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
            startPauseIcon.className = "fa-solid fa-play";
            startPauseText.textContent = "Start";

            updateDisplay();
        }

        // Quick Preset selection handler
        function setPreset(seconds) {
            totalTime = seconds;
            remainingTime = seconds;
            resetTimer();
        }

        // Custom duration input handler
        function applyCustomTime() {
            const h = parseInt(document.getElementById('customHours').value) || 0;
            const m = parseInt(document.getElementById('customMinutes').value) || 0;
            const s = parseInt(document.getElementById('customSeconds').value) || 0;

            const calculatedTotal = (h * 3600) + (m * 60) + s;

            if (calculatedTotal > 0) {
                totalTime = calculatedTotal;
                remainingTime = calculatedTotal;
                resetTimer();
            }
        }

        // Timer Completion Handler
        function onTimerComplete() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingTime = 0;
            updateDisplay();

            statusLabel.textContent = "Time's Up!";
            statusLabel.className = "text-xs uppercase font-bold tracking-wider text-rose-500 mt-2 animate-bounce";

            startPauseBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
            startPauseBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
            startPauseIcon.className = "fa-solid fa-play";
            startPauseText.textContent = "Start";

            playAlarmSound();
        }

        // Sound Audio Synthesizer (Tone Generation without external files)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high text-lg";
                soundIcon.parentElement.classList.remove('text-rose-400');
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-lg";
                soundIcon.parentElement.classList.add('text-rose-400');
            }
        }

        function playAlarmSound() {
            if (!soundEnabled) return;
            initAudio();

            // Play 3 repetitive beeps using Web Audio API
            const now = audioCtx.currentTime;
            [0, 0.25, 0.5, 0.8].forEach((delay) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now + delay); // A5 pitch

                gain.gain.setValueAtTime(0.3, now + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.18);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + delay);
                osc.stop(now + delay + 0.2);
            });
        }

        // Initial setup on load
        updateDisplay();
    </script>
</body>
</html>
